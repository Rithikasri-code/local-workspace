<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#a855f7" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Border & Frame -->
  <rect x="2" y="2" width="896" height="236" rx="12" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />
  <rect x="8" y="8" width="884" height="224" rx="8" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.25" />

  <!-- Graph Node Links on Left -->
  <g transform="translate(80, 80)" stroke="#6366f1" stroke-width="1.5" opacity="0.35">
    <line x1="20" y1="20" x2="60" y2="50" />
    <line x1="60" y1="50" x2="100" y2="20" />
    <line x1="60" y1="50" x2="60" y2="90" />
    <circle cx="20" cy="20" r="4" fill="#a855f7" />
    <circle cx="60" cy="50" r="5" fill="#38bdf8" />
    <circle cx="100" cy="20" r="4" fill="#a855f7" />
    <circle cx="60" cy="90" r="4" fill="#818cf8" />
  </g>

  <!-- File Markdown Hierarchy on Right -->
  <g transform="translate(730, 85)" fill="#94a3b8" class="mono" font-size="11">
    <text x="0" y="0">📁 workspace/</text>
    <text x="14" y="18">├── 📄 tasks.md</text>
    <text x="14" y="36">├── 📄 goals.md</text>
    <text x="14" y="54">└── 📁 memory/</text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#a855f7" stroke-width="2" />
  <path d="M 884 32 L 884 16 L 868 16" fill="none" stroke="#a855f7" stroke-width="2" />
  <path d="M 16 208 L 16 224 L 32 224" fill="none" stroke="#a855f7" stroke-width="2" />
  <path d="M 884 208 L 884 224 L 868 224" fill="none" stroke="#a855f7" stroke-width="2" />

  <!-- Main Titles -->
  <text x="450" y="52" text-anchor="middle" fill="#a855f7" class="mono" font-size="13" letter-spacing="2">&lt;AGENT_NATIVE / KNOWLEDGE_OS&gt;</text>
  <text x="450" y="100" text-anchor="middle" fill="#f8fafc" class="sans" font-size="38" font-weight="800" letter-spacing="4" filter="url(#softGlow)">WORKSPACE</text>
  <text x="450" y="130" text-anchor="middle" fill="#c4b5fd" class="sans" font-size="14" font-weight="500" letter-spacing="1.5">AGENT-NATIVE TASK OPERATING SYSTEM &amp; MARKDOWN KNOWLEDGE HUB</text>

  <!-- Divider -->
  <line x1="220" y1="146" x2="680" y2="146" stroke="#312e81" stroke-width="1" />

  <!-- Pills -->
  <g transform="translate(145, 162)">
    <rect x="0" y="0" width="135" height="26" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6" />
    <text x="67" y="17" text-anchor="middle" fill="#f3e8ff" class="mono" font-size="11">AGENTS.md Standard</text>

    <rect x="150" y="0" width="145" height="26" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6" />
    <text x="222" y="17" text-anchor="middle" fill="#e0e7ff" class="mono" font-size="11">Plain Markdown Core</text>

    <rect x="310" y="0" width="145" height="26" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <text x="382" y="17" text-anchor="middle" fill="#e0f2fe" class="mono" font-size="11">File System Access</text>

    <rect x="470" y="0" width="135" height="26" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6" />
    <text x="537" y="17" text-anchor="middle" fill="#f3e8ff" class="mono" font-size="11">Zero Cloud Lock-in</text>
  </g>

  <text x="450" y="214" text-anchor="middle" fill="#6366f1" class="mono" font-size="11">Multi-Agent Protocol • Claude · Codex · Antigravity · Cursor Compatible • 100% Private</text>
</svg>
